<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나를 소개합니다 — 공개 범위 점검표</title>
</head>
<body>
  <h1>나를 소개합니다</h1>

  <!-- T01-C03: 대상과 목적 1문장 -->
  <h2>대상과 목적</h2>
  <p>이 페이지는 나를 처음 만나는 사람에게 나의 관심사와 활동을 소개하기 위한 페이지입니다.</p>

  <!-- T01-C04: 공개할 정보 3개 이상 -->
  <h2>공개할 정보</h2>
  <ul>
    <li>닉네임: (여기에 닉네임)</li>
    <li>관심사·취미: 코딩, (추가 취미)</li>
    <li>좋아하는 것/목표: 웹 개발자 되기</li>
  </ul>

  <!-- T01-C05: 공개하지 않을 정보 3개 이상 -->
  <h2>공개하지 않을 정보</h2>
  <ul>
    <li>집 주소·상세 거주지</li>
    <li>전화번호·개인 이메일</li>
    <li>비밀번호·계정 정보</li>
  </ul>

  <h2>한 줄 소개</h2>
  <p>안녕하세요, (닉네임)입니다. 코딩을 좋아하고 웹 개발자를 목표로 공부하고 있습니다.</p>
</body>
</html>
